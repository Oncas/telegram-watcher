[project]
name = "telegram-watcher"
version = "0.1.0"
description = "Polls selected Telegram chats and keeps a local record of their posts."
requires-python = ">=3.14"
dependencies = [
    "telethon>=1.40,<2",
]

[project.scripts]
telegram-watcher = "telegram_watcher.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
